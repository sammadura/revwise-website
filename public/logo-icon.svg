<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#349cff"/>
      <stop offset="100%" stop-color="#604BEA"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="24" y1="12" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#brand-grad)"/>
  <!-- 5-point star (reviews) -->
  <path d="M32 14l4.9 10 11.1 1.6-8 7.8 1.9 11L32 39l-9.9 5.4 1.9-11-8-7.8L27.1 24z" fill="url(#star-grad)" opacity="0.95"/>
  <!-- Upward trend arrow (growth) -->
  <path d="M16 52l10-8 8 4 14-12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <path d="M42 36l6 0 0-6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
</svg>
